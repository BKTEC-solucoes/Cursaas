services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    expose:
      - "3306"

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
      args:
        BACKEND_DIR: backend
        UVICORN_APP: "app.main:app"
    env_file:
      - .env
    volumes:
      # Sem este volume os videos enviados sumiam a cada recriacao do container:
      # UPLOAD_DIR fica dentro do filesystem efemero da imagem.
      - uploads_data:/app/uploads
    expose:
      - "8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # Side-car de login com Google. Estava ausente do Compose: o botao "Entrar com
  # Google" apontava para localhost:3000, que nao existia na stack.
  backend-node:
    build:
      context: .
      dockerfile: docker/backend-node.Dockerfile
      args:
        NODE_DIR: backend-node
    environment:
      PORT: "3000"
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${DB_NAME}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      # Precisa ser identico ao SECRET_KEY do FastAPI: os dois servicos assinam
      # tokens que o outro valida.
      JWT_SECRET: ${SECRET_KEY}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: docker/frontend-angular.Dockerfile
      args:
        FRONTEND_DIR: frontend
    expose:
      - "8080"
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
      - backend-node
    restart: unless-stopped

volumes:
  db_data:
  uploads_data:
