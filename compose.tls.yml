# Overlay de TLS. Uso:
#
#   docker compose -f compose.yml -f compose.tls.yml up -d
#
# Mantido separado do compose.yml porque exige um pre-requisito que o Compose
# nao consegue garantir: o registro A de bktec.dev.br precisa apontar para este
# servidor ANTES de qualquer emissao. O desafio HTTP-01 do Let's Encrypt resolve
# o dominio pela internet publica e busca o token em http://<dominio>/.well-known
# — se o DNS levar a outro host, a emissao falha e consome cota de erro.
#
# A emissao inicial e feita pelo scripts/emitir-certificado.sh, que roda o
# certbot uma vez com o nginx ja no ar servindo o webroot.

services:
  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/default.tls.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro

  # Renovacao automatica. O certificado do Let's Encrypt dura 90 dias; o certbot
  # so renova quando faltam menos de 30, entao o loop de 12h e barato e cobre a
  # janela com folga. O reload do nginx e feito pelo servico nginx-reload abaixo,
  # porque este container nao alcanca o binario do outro.
  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: >
      sh -c "trap exit TERM;
      while :; do certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done"
    restart: unless-stopped
    depends_on:
      - nginx

volumes:
  certbot_conf:
  certbot_www:
