# Config do nginx DENTRO da imagem do frontend (porta 8080, atras do nginx de
# borda). Era um `printf` embutido no Dockerfile com uma unica regra:
#
#     location / { try_files $uri $uri/ /index.html; }
#
# Esse fallback vale para QUALQUER caminho, inclusive os bundles com hash. Quando
# um deploy troca os hashes, a aba que ja estava aberta pede o chunk antigo e
# recebe 200 + text/html (o index.html) no lugar de 404. O browser nao executa
# HTML como modulo, o carregamento da rota lazy falha e a navegacao morre em
# silencio - o sintoma real foi login bem-sucedido preso na tela de login.

server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    # Assets com hash no nome. `=404` em vez do fallback: se o arquivo sumiu, a
    # resposta honesta e 404. E o que permite o app detectar "meu build venceu"
    # e recarregar, em vez de receber HTML disfarcado de JavaScript.
    #
    # O hash no nome ja e o versionamento, entao o conteudo e imutavel: cada
    # build gera nomes novos e o cache antigo nunca precisa ser revalidado.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp|avif|map)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # O index.html NAO pode ser cacheado: e ele que aponta para os nomes novos
    # dos bundles. Cacheado, o browser continuaria pedindo os hashes antigos
    # mesmo depois do deploy - o F5 nao resolveria, so o Ctrl+Shift+R.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Rotas do SPA: aqui o fallback e correto, /admin e /aluno nao sao arquivos.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
