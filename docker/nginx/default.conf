server {
    listen 80;
    server_name _;

    # Alinhado com MAX_FILE_SIZE do backend (500 MB). Estava em 20m, o que
    # cortava upload de video com 413 antes de chegar no FastAPI.
    client_max_body_size 512m;

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEM barra final no proxy_pass.
    #
    # Com "http://backend:8000/" o nginx troca o /api/ casado pela barra e
    # entrega /cursos/ ao FastAPI — que monta os routers em /api/cursos.
    # Resultado: 404 em toda a API. Sem a barra, o path chega intacto.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload de video e lento; os 60s padrao derrubam a conexao no meio.
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        proxy_request_buffering off;
    }

    # Avatares (StaticFiles do FastAPI). Videos NAO passam por aqui — sao
    # servidos por /api/aulas/video/{filename}, que exige autenticacao.
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Desafio ACME do Let's Encrypt. Precisa ser servido em HTTP puro, por este
    # bloco, antes de existir qualquer certificado — sem isso a emissao inicial
    # nao tem como validar o dominio.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Login com Google (side-car Express).
    #
    # O upstream vem de uma VARIAVEL de proposito. Com o nome literal, o nginx
    # resolve todos os upstreams ao carregar a config e aborta com "host not
    # found in upstream" se um deles nao existir — ou seja, o backend-node fora
    # do ar derrubava o site inteiro, API e SPA junto. Com a variavel, a
    # resolucao passa a ser por requisicao: /auth/ responde 502 enquanto o
    # side-car estiver fora, e o resto do site segue de pe.
    #
    # 127.0.0.11 e o DNS embutido do Docker. Sem "resolver" o nginx nao sabe
    # resolver nomes em tempo de requisicao.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_auth backend-node:3000;

    # ATENCAO: o prefixo e /auth/google, NAO /auth/.
    #
    # O side-car Express so expoe /auth/google e /auth/google/callback. Mas o
    # SPA tambem usa /auth/ para paginas proprias — /auth/login, /auth/register,
    # /auth/convite. Com "location /auth/" o nginx entregava TODAS elas ao
    # side-car, que nao as conhece: a tela de login e o aceite de convite
    # respondiam 502 e o sistema ficava inacessivel pela interface.
    location /auth/google {
        proxy_pass http://$upstream_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }
}
