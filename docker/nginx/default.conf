server {
    listen 80;
    server_name _;

    # Alinhado com MAX_FILE_SIZE do backend (500 MB). Estava em 20m, o que
    # cortava upload de video com 413 antes de chegar no FastAPI.
    client_max_body_size 512m;

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEM barra final no proxy_pass.
    #
    # Com "http://backend:8000/" o nginx troca o /api/ casado pela barra e
    # entrega /cursos/ ao FastAPI — que monta os routers em /api/cursos.
    # Resultado: 404 em toda a API. Sem a barra, o path chega intacto.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload de video e lento; os 60s padrao derrubam a conexao no meio.
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        proxy_request_buffering off;
    }

    # Avatares (StaticFiles do FastAPI). Videos NAO passam por aqui — sao
    # servidos por /api/aulas/video/{filename}, que exige autenticacao.
    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Login com Google (side-car Express).
    location /auth/ {
        proxy_pass http://backend-node:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }
}
