server {
    listen 80;
    server_name _;

    # Alinhado com MAX_FILE_SIZE do backend (500 MB). Estava em 20m, o que
    # cortava upload de video com 413 antes de chegar no FastAPI.
    client_max_body_size 512m;

    # ─── Resolucao de upstream em tempo de REQUISICAO ────────────────────────
    #
    # 127.0.0.11 e o DNS embutido do Docker. Sem "resolver" o nginx nao sabe
    # resolver nomes fora do carregamento da config.
    #
    # TODO upstream passa por variavel, de proposito. Com o nome literal o
    # nginx resolve o IP UMA vez, ao carregar a config, e o guarda para sempre.
    # Isso causava dois defeitos distintos:
    #
    #   1. Upstream ausente no boot impede o nginx de iniciar ("host not found
    #      in upstream") — o backend-node fora do ar derrubava API e SPA junto.
    #
    #   2. Upstream que TROCA de IP passa a receber 502 indefinidamente. Todo
    #      `docker compose restart backend` (ou recreate, ou restart apos
    #      crash) da um IP novo ao container, e o nginx segue tentando o
    #      antigo: "connect() failed (113: Host is unreachable)". A API ficava
    #      fora do ar ate alguem recarregar o nginx a mao.
    #
    # O defeito 2 valia para `backend` e `frontend`, que ainda usavam o nome
    # literal. Com a variavel, a resolucao passa a ser por requisicao: um
    # upstream fora do ar responde 502 apenas nas rotas dele, e volta sozinho
    # assim que subir — sem reload.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_frontend frontend:8080;
    set $upstream_backend  backend:8000;
    set $upstream_auth     backend-node:3000;

    location / {
        proxy_pass http://$upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEM barra final nem path no proxy_pass.
    #
    # Com "http://backend:8000/" o nginx troca o /api/ casado pela barra e
    # entrega /cursos/ ao FastAPI — que monta os routers em /api/cursos.
    # Resultado: 404 em toda a API. Sem a barra, o path chega intacto.
    #
    # A regra vale igual com a variavel: `proxy_pass http://$var;` continua
    # sendo "sem URI", entao o nginx repassa a URI original do cliente. Nao
    # acrescente barra nem $request_uri aqui.
    location /api/ {
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upload de video e lento; os 60s padrao derrubam a conexao no meio.
        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        proxy_request_buffering off;
    }

    # Avatares (StaticFiles do FastAPI). Videos NAO passam por aqui — sao
    # servidos por /api/aulas/video/{filename}, que exige autenticacao.
    location /uploads/ {
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Desafio ACME do Let's Encrypt. Precisa ser servido em HTTP puro, por este
    # bloco, antes de existir qualquer certificado — sem isso a emissao inicial
    # nao tem como validar o dominio.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Login com Google (side-car Express). O upstream vem de variavel pelo
    # mesmo motivo dos demais — ver o bloco de resolucao no topo do server.
    #
    # ATENCAO: o prefixo e /auth/google, NAO /auth/.
    #
    # O side-car Express so expoe /auth/google e /auth/google/callback. Mas o
    # SPA tambem usa /auth/ para paginas proprias — /auth/login, /auth/register,
    # /auth/convite. Com "location /auth/" o nginx entregava TODAS elas ao
    # side-car, que nao as conhece: a tela de login e o aceite de convite
    # respondiam 502 e o sistema ficava inacessivel pela interface.
    location /auth/google {
        proxy_pass http://$upstream_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Aqui a URI E especificada de proposito: /health do nginx mapeia para
    # /health do FastAPI, que nao fica sob /api.
    location = /health {
        proxy_pass http://$upstream_backend/health;
    }
}
