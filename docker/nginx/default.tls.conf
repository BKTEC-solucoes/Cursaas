# Variante TLS de default.conf, ativada pelo overlay compose.tls.yml.
#
# Diferencas em relacao ao default.conf:
#   - :80 so serve o desafio ACME e redireciona o resto para HTTPS;
#   - o bloco de aplicacao passa a escutar :443 com o certificado do Let's Encrypt;
#   - server_name deixa de ser "_" porque o certificado e emitido por nome.
#
# As regras de proxy sao identicas ao default.conf — inclusive a ausencia de
# barra final no proxy_pass, sem a qual o nginx troca o prefixo casado e a API
# inteira responde 404.

server {
    listen 80;
    server_name bktec.dev.br www.bktec.dev.br;

    # Precisa vir antes do redirect: o Let's Encrypt busca o token em HTTP puro,
    # e um 301 aqui quebraria a validacao.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name bktec.dev.br www.bktec.dev.br;

    ssl_certificate     /etc/letsencrypt/live/bktec.dev.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bktec.dev.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Alinhado com MAX_FILE_SIZE do backend (500 MB).
    client_max_body_size 512m;

    location / {
        proxy_pass http://frontend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEM barra final no proxy_pass — ver comentario em default.conf.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        proxy_request_buffering off;
    }

    location /uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /auth/ {
        proxy_pass http://backend-node:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
    }
}
