# Variante TLS de default.conf, ativada pelo overlay compose.tls.yml.
#
# Diferencas em relacao ao default.conf:
#   - :80 so serve o desafio ACME e redireciona o resto para HTTPS;
#   - o bloco de aplicacao passa a escutar :443 com o certificado do Let's Encrypt;
#   - server_name deixa de ser "_" porque o certificado e emitido por nome.
#
# As regras de proxy sao identicas ao default.conf — inclusive a ausencia de
# barra final no proxy_pass, sem a qual o nginx troca o prefixo casado e a API
# inteira responde 404.

server {
    listen 80;
    server_name cursaas.bktec.dev.br bktec.dev.br www.bktec.dev.br;

    # Precisa vir antes do redirect: o Let's Encrypt busca o token em HTTP puro,
    # e um 301 aqui quebraria a validacao.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # $host e nao o dominio literal: em HTTP o apex ainda precisa chegar ao
    # HTTPS do proprio nome para so entao ser redirecionado ao subdominio pelo
    # bloco :443 abaixo. Mandar direto para cursaas.bktec.dev.br aqui pularia a
    # validacao ACME de bktec.dev.br/www, que tambem passam por esta porta.
    location / {
        return 301 https://$host$request_uri;
    }
}

# O dominio canonico e o subdominio; o apex e o www so redirecionam.
#
# Este bloco existe para nao quebrar links, favoritos e o Google OAuth antigos
# apontados para bktec.dev.br. Ele PRECISA do apex no mesmo certificado — o
# handshake TLS acontece antes do 301, entao um redirect servido com
# certificado que nao cobre o nome mostra aviso de seguranca em vez de
# redirecionar. Ver scripts/emitir-certificado.sh, que emite os tres nomes.
server {
    listen 443 ssl;
    http2 on;
    server_name bktec.dev.br www.bktec.dev.br;

    ssl_certificate     /etc/letsencrypt/live/bktec.dev.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bktec.dev.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    return 301 https://cursaas.bktec.dev.br$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name cursaas.bktec.dev.br;

    # O caminho do certificado segue nomeado "bktec.dev.br" de proposito: e a
    # linhagem ja existente no servidor, apenas EXPANDIDA para incluir o
    # subdominio (certbot --cert-name mantem o diretorio do primeiro nome
    # emitido). Trocar o caminho aqui exigiria uma linhagem nova em disco antes
    # do deploy, e o nginx se recusa a iniciar apontando para um arquivo que
    # ainda nao existe — derrubando o site inteiro no primeiro deploy.
    ssl_certificate     /etc/letsencrypt/live/bktec.dev.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bktec.dev.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Alinhado com MAX_FILE_SIZE do backend (500 MB).
    client_max_body_size 512m;

    # Resolucao de upstream por requisicao — ver o comentario extenso em
    # default.conf. Resumo: com o nome literal o nginx fixa o IP no boot, e
    # todo restart de container passa a responder 502 ("Host is unreachable")
    # ate alguem recarregar o nginx.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $upstream_frontend frontend:8080;
    set $upstream_backend  backend:8000;
    set $upstream_auth     backend-node:3000;

    location / {
        proxy_pass http://$upstream_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SEM barra final nem path no proxy_pass — ver comentario em default.conf.
    location /api/ {
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout      600s;
        proxy_send_timeout      600s;
        proxy_request_buffering off;
    }

    # Entrega de video via X-Accel-Redirect. `internal` = so o proprio nginx
    # entra aqui, quando o FastAPI valida a assinatura e responde com o header
    # apontando para /_video/<arquivo>. Precisa existir nas DUAS configs (esta e
    # a default.conf): a overlay de TLS troca o arquivo inteiro, nao acrescenta.
    location /_video/ {
        internal;
        alias /var/lib/cursaas/uploads/videos/;
    }

    location /uploads/ {
        proxy_pass http://$upstream_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ATENCAO: o prefixo e /auth/google, NAO /auth/.
    #
    # O side-car Express so expoe /auth/google e /auth/google/callback. Mas o
    # SPA tambem usa /auth/ para paginas proprias — /auth/login, /auth/register,
    # /auth/convite. Com "location /auth/" o nginx entregava TODAS elas ao
    # side-car, que nao as conhece: a tela de login e o aceite de convite
    # respondiam 502 e o sistema ficava inacessivel pela interface.
    location /auth/google {
        proxy_pass http://$upstream_auth;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # URI especificada de proposito: /health do FastAPI nao fica sob /api.
    location = /health {
        proxy_pass http://$upstream_backend/health;
    }
}
