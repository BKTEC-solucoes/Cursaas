<div class="login-container">
  <div class="login-box">
    <h1>Cursaas</h1>
    <p class="subtitle">Portal EAD</p>
    
    <form (ngSubmit)="login()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="seu@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Senha</label>
        <div class="password-field">
          <input
            [type]="showPassword ? 'text' : 'password'"
            id="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Sua senha"
            required
          />
          <button type="button" class="toggle-password" (click)="showPassword = !showPassword">
            {{ showPassword ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      <div *ngIf="error" class="error-message">{{ error }}</div>

      <button type="submit" class="submit-button" [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Entrar' }}
      </button>

      <div class="divider">
        <span>ou</span>
      </div>

      <button
        type="button"
        class="google-button"
        [disabled]="googleLoading || !googleConfigured"
        (click)="loginWithGoogle()"
      >
        {{
          googleConfigured
            ? (googleLoading ? 'Conectando com Google...' : 'Entrar com Google')
            : 'Configure o Google Client ID'
        }}
      </button>
    </form>

    <div class="register-link">
      <p>Não tem uma conta? <a routerLink="/auth/register">Criar conta</a></p>
    </div>

    <div class="demo-credentials">
      <p><strong>Demo Credentials:</strong></p>
      <p>Admin: admin&#64;example.com / senha123</p>
      <p>Aluno: aluno1&#64;example.com / senha123</p>
    </div>
  </div>
</div>
