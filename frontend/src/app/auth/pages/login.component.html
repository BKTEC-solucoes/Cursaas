<!-- ═══════════════════════════════════════════════════════════════════════
     login.component.html
     Suporta 3 layouts via classe CSS:
       login-page--centered    → card centralizado sobre background de cor/gradiente/imagem
       login-page--split-left  → esquerda = branding, direita = formulário
       login-page--split-right → esquerda = formulário, direita = branding
     ══════════════════════════════════════════════════════════════════════ -->
<div class="login-page" [class]="'login-page--' + loginLayout()">

  <!-- ── PAINEL DE BRANDING ─────────────────────────────────────────────── -->
  <!-- Em layout centered: funciona como background de tela cheia.          -->
  <!-- Em layout split-*: painel lateral com logo + mensagem institucional. -->
  <section
    class="login-branding"
    [style.background]="brandingBg()"
    aria-hidden="true"
  >
    <!-- Overlay de contraste (obrigatório em imagens para WCAG) -->
    <div class="branding-overlay" [class.branding-overlay--visible]="brandingIsImage()"></div>

    <div class="branding-content">
      @if (logoUrl()) {
        <img [src]="logoUrl()!" alt="{{ institutionName() }}" class="branding-logo" />
      } @else {
        <span class="branding-wordmark">{{ institutionName() }}</span>
      }
      @if (messageTitle()) {
        <h2 class="branding-title">{{ messageTitle() }}</h2>
      }
      <p class="branding-body">{{ messageBody() }}</p>
    </div>
  </section>

  <!-- ── PAINEL DE FORMULÁRIO ───────────────────────────────────────────── -->
  <section class="login-panel">
    <div class="login-card">

      <!-- Logo dentro do card (exibido apenas em layout centered) -->
      <div class="card-brand">
        @if (logoUrl()) {
          <img [src]="logoUrl()!" alt="{{ institutionName() }}" class="card-logo" />
        } @else {
          <span class="card-wordmark">{{ institutionName() }}</span>
        }
      </div>

      <h1 class="card-heading">Entrar</h1>
      <p class="card-sub">Acesse sua conta para continuar</p>

      <form (ngSubmit)="login()" novalidate>

        <div class="form-field">
          <label class="form-label" for="email">Email</label>
          <input
            class="form-input"
            type="email"
            id="email"
            [(ngModel)]="email"
            name="email"
            placeholder="seu@email.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="form-field">
          <label class="form-label" for="password">Senha</label>
          <div class="input-with-action">
            <input
              class="form-input"
              [type]="showPassword ? 'text' : 'password'"
              id="password"
              [(ngModel)]="password"
              name="password"
              placeholder="Sua senha"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              class="input-action"
              (click)="showPassword = !showPassword"
              [attr.aria-label]="showPassword ? 'Ocultar senha' : 'Mostrar senha'"
            >{{ showPassword ? 'Ocultar' : 'Mostrar' }}</button>
          </div>
        </div>

        @if (error) {
          <p class="form-error login-error" role="alert">{{ error }}</p>
        }

        <button
          type="submit"
          class="btn btn-primary btn-full"
          [disabled]="loading"
        >{{ loading ? 'Entrando…' : 'Entrar' }}</button>

      </form>

      <div class="divider"><span>ou</span></div>

      <button
        type="button"
        class="btn btn-google btn-full"
        [disabled]="googleLoading || !googleConfigured"
        (click)="loginWithGoogle()"
      >
        {{
          googleConfigured
            ? (googleLoading ? 'Conectando…' : 'Entrar com Google')
            : 'Configure o Google Client ID'
        }}
      </button>

      <p class="register-link">
        Não tem uma conta?
        <a routerLink="/auth/register">Criar conta</a>
      </p>

    </div>
  </section>

</div>
