<div class="auth-page">
  <div class="auth-card">
    <h1 class="auth-heading">Criar Conta</h1>
    <p class="auth-sub">Qual tipo de conta você deseja criar?</p>

    <div class="chooser">
      <button class="chooser-btn" (click)="selectAluno()">
        <svg class="chooser-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7"/>
        </svg>
        <span class="chooser-label">Aluno</span>
        <span class="chooser-hint">Quero acessar cursos</span>
      </button>

      <button class="chooser-btn" (click)="selectInstituicao()">
        <svg class="chooser-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/><line x1="12" y1="12" x2="12" y2="16"/><line x1="10" y1="14" x2="14" y2="14"/>
        </svg>
        <span class="chooser-label">Instituição</span>
        <span class="chooser-hint">Quero oferecer cursos</span>
      </button>
    </div>

    <p class="auth-footer-link">
      <a (click)="goBack()" href="javascript:void(0)">Voltar para login</a>
    </p>
  </div>
</div>
