<div class="register-container">
  <div class="register-box">
    <h1>Cadastro de Aluno</h1>
    <p class="subtitle">Preencha seus dados para solicitar acesso à plataforma</p>
    
    <form (ngSubmit)="register()" *ngIf="!success">
      <div class="form-group">
        <label for="faculdade">Faculdade</label>
        <select
          id="faculdade"
          [(ngModel)]="faculdadeId"
          name="faculdadeId"
          [disabled]="carregandoFaculdades"
          required
        >
          <option [ngValue]="null" disabled>
            {{ carregandoFaculdades ? 'Carregando...' : 'Selecione sua faculdade' }}
          </option>
          <option *ngFor="let f of faculdades" [ngValue]="f.id">{{ f.nome }}</option>
        </select>
      </div>

      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input
          type="text"
          id="nome"
          [(ngModel)]="nome"
          name="nome"
          placeholder="Seu nome completo"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">
          Email
          <span *ngIf="validandoEmail" class="validating">Verificando...</span>
          <span *ngIf="!validandoEmail && emailEmUso" class="email-em-uso">✗ Email em uso</span>
          <span *ngIf="!validandoEmail && !emailEmUso && email" class="email-disponivel">✓ Email disponível</span>
        </label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          (blur)="verificarEmailDisponivel()"
          placeholder="seu@email.com"
          [class.email-error]="emailEmUso"
          required
        />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <div class="password-field">
          <input
            [type]="showSenha ? 'text' : 'password'"
            id="senha"
            [(ngModel)]="senha"
            name="senha"
            placeholder="Mínimo 6 caracteres"
            required
          />
          <button 
            type="button" 
            class="toggle-password" 
            (click)="showSenha = !showSenha"
          >
            {{ showSenha ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmar Senha</label>
        <div class="password-field">
          <input
            [type]="showConfirmarSenha ? 'text' : 'password'"
            id="confirmarSenha"
            [(ngModel)]="confirmarSenha"
            name="confirmarSenha"
            placeholder="Digite a senha novamente"
            required
          />
          <button 
            type="button" 
            class="toggle-password" 
            (click)="showConfirmarSenha = !showConfirmarSenha"
          >
            {{ showConfirmarSenha ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      <div *ngIf="error" class="error-message">{{ error }}</div>

      <button 
        type="submit" 
        class="submit-button" 
        [disabled]="loading || emailEmUso || validandoEmail || !faculdadeId"
      >
        {{ loading ? 'Enviando solicitação...' : 'Criar Conta' }}
      </button>
    </form>

    <div *ngIf="success" class="success-message">
      <div class="success-icon">⏳</div>
      <h2>Solicitação enviada!</h2>
      <p>Sua conta foi criada. Aguarde a aprovação do administrador para acessar os cursos.</p>
      <p class="redirect-info">Você será redirecionado ao catálogo em instantes...</p>
    </div>

    <div class="back-link">
      <a (click)="goBack()" href="javascript:void(0)">Voltar</a>
    </div>
  </div>
</div>
