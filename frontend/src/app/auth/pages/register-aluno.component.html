<div class="register-container">
  <div class="register-box">
    <h1>Cadastro de Aluno</h1>
    <p class="subtitle">Preencha seus dados para criar uma conta</p>
    
    <form (ngSubmit)="register()" *ngIf="!success">
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input
          type="text"
          id="nome"
          [(ngModel)]="nome"
          name="nome"
          placeholder="Seu nome completo"
          required
        />
      </div>

      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          [(ngModel)]="email"
          name="email"
          placeholder="seu@email.com"
          required
        />
      </div>

      <div class="form-group">
        <label for="senha">Senha</label>
        <div class="password-field">
          <input
            [type]="showSenha ? 'text' : 'password'"
            id="senha"
            [(ngModel)]="senha"
            name="senha"
            placeholder="Mínimo 6 caracteres"
            required
          />
          <button 
            type="button" 
            class="toggle-password" 
            (click)="showSenha = !showSenha"
          >
            {{ showSenha ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      <div class="form-group">
        <label for="confirmarSenha">Confirmar Senha</label>
        <div class="password-field">
          <input
            [type]="showConfirmarSenha ? 'text' : 'password'"
            id="confirmarSenha"
            [(ngModel)]="confirmarSenha"
            name="confirmarSenha"
            placeholder="Digite a senha novamente"
            required
          />
          <button 
            type="button" 
            class="toggle-password" 
            (click)="showConfirmarSenha = !showConfirmarSenha"
          >
            {{ showConfirmarSenha ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
      </div>

      <div *ngIf="error" class="error-message">{{ error }}</div>

      <button type="submit" class="submit-button" [disabled]="loading">
        {{ loading ? 'Criando conta...' : 'Criar Conta' }}
      </button>
    </form>

    <div *ngIf="success" class="success-message">
      <div class="success-icon">✓</div>
      <h2>Bem-vindo!</h2>
      <p>Redirecionando para as lojas...</p>
    </div>

    <div class="back-link">
      <a (click)="goBack()" href="javascript:void(0)">Voltar</a>
    </div>
  </div>
</div>
