<!DOCTYPE html>
<html>
<head>
    <title>Teste API - Resultado da Prova</title>
</head>
<body>
    <h1>Teste API - Resultado da Prova</h1>
    
    <form id="testForm">
        <label>Prova ID:</label>
        <input type="number" id="provaId" value="1" />
        
        <label>Token JWT:</label>
        <input type="text" id="token" placeholder="Cole seu token aqui" style="width: 400px;" />
        
        <button type="button" onclick="testApi()">🧪 Testar Endpoint</button>
    </form>
    
    <h2>Resposta:</h2>
    <pre id="resultado">Aguardando resposta...</pre>
    
    <script>
        function testApi() {
            const provaId = document.getElementById('provaId').value;
            const token = document.getElementById('token').value;
            
            if (!token) {
                alert('Cole o token JWT primeiro!');
                return;
            }
            
            const url = `http://localhost:8000/api/provas/${provaId}/meu-resultado`;
            
            console.log('🌐 Requisição para:', url);
            
            fetch(url, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                console.log('Status:', response.status);
                return response.json().then(data => ({ status: response.status, data }));
            })
            .then(({ status, data }) => {
                console.log('✅ Resposta:', data);
                document.getElementById('resultado').textContent = 
                    'Status: ' + status + '\n\n' + JSON.stringify(data, null, 2);
            })
            .catch(error => {
                console.error('❌ Erro:', error);
                document.getElementById('resultado').textContent = 
                    '❌ ERRO: ' + error.message + '\n\n' + error;
            });
        }
        
        // Tentar pegar o token do localStorage
        window.addEventListener('load', () => {
            const token = localStorage.getItem('access_token');
            if (token) {
                document.getElementById('token').value = token;
            }
        });
    </script>
</body>
</html>
