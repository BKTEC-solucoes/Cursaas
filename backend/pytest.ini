[pytest]
testpaths = tests
python_files = test_*.py
# Os test_*.py na RAIZ de backend/ não são pytest: são scripts ad-hoc que fazem
# requests.post contra um servidor rodando, com credenciais hardcoded. Coletá-los
# dispararia chamadas de rede na hora do import, então testpaths limita a tests/.
addopts = -q --strict-markers
