[pytest]
testpaths = tests
# Sem isto, `import app` so funciona quando a suite e chamada como
# `python -m pytest` — essa forma insere o cwd no sys.path, o executavel
# `pytest` nao. Como tests/ nao tem __init__.py, o pytest poe tests/ no path e
# backend/ fica de fora: passava na maquina do dev e quebrava na CI, que chama
# `pytest` direto. O caminho e relativo ao rootdir (backend/, onde este arquivo
# mora), entao vale de qualquer diretorio.
pythonpath = .
python_files = test_*.py
# Os test_*.py na RAIZ de backend/ não são pytest: são scripts ad-hoc que fazem
# requests.post contra um servidor rodando, com credenciais hardcoded. Coletá-los
# dispararia chamadas de rede na hora do import, então testpaths limita a tests/.
addopts = -q --strict-markers
